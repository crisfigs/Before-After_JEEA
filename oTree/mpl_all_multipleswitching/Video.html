{{ block title }}
{{ endblock }}

{{ block styles }}
<style>
    #vid {
        position: fixed;
        right: 0;
        bottom: 0;
        min-width: 100%;
        min-height: 100%;
        background: #000;
        z-index: 1;
    }
    #start, #show {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 2;              /* above the video */
        border-radius: 12px;
        border: none;
        color: white;
        background-color: orange;
        padding: 20px 30px;
        font-size: 18px;
    }
</style>
{{ endblock }}

{{ block content }}

<!-- No controls and no autoplay: the video starts with the Start button, cannot be paused or skipped,
     and the NEXT button appears only when it has ended -->
<video id="vid" playsinline preload="auto" disablepictureinpicture>
    <source src="{{ video_link }}" type="video/mp4">
</video>

<!-- type="button" so this button does not submit the page -->
<button type="button" id="start">Start the {{ position }} video</button>
<button id="show" style="visibility: hidden;">NEXT</button>

{{ endblock }}

{{ block scripts }}
<script>
    var video = document.getElementById("vid");
    var start = document.getElementById("start");
    video.disablePictureInPicture = true;

    // Start the video on click (a click on this page always allows playback with sound)
    start.addEventListener("click", function () {
        video.play();
        start.style.display = "none";
    });

    // If the video stops before the end (e.g. the tab was switched), a click anywhere resumes it
    document.addEventListener("click", function (e) {
        if (e.target.id !== "show" && e.target.id !== "start" && video.paused && !video.ended
                && start.style.display === "none") {
            video.play();
        }
    });

    // Show the NEXT button once the video has ended
    video.addEventListener("ended", function () {
        document.getElementById("show").style.visibility = "visible";
    });
</script>
{{ endblock }}
